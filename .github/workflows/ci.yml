name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: homa
          POSTGRES_PASSWORD: homa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homa" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://homa:homa@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Generated API client is up to date
        run: |
          bun run openapi
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client is out of date. Run 'bun run openapi' and commit the result."
            exit 1
          }
