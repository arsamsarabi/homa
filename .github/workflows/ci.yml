name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: homa
          POSTGRES_PASSWORD: homa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homa" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://homa:homa@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Generated API client is up to date
        run: |
          bun run openapi
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client is out of date. Run 'bun run openapi' and commit the result."
            exit 1
          }

  e2e:
    name: Docker image and smoke test
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: deploy/docker/compose.yaml
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway auth secret for this run
        run: |
          secret=$(openssl rand -base64 32)
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: First-run setup code from the API log
        run: |
          code=$(docker compose logs api | grep -oE 'first-run setup code: [0-9]{4}' | head -1 | grep -oE '[0-9]{4}$')
          test -n "$code"
          echo "HOMA_SETUP_CODE=$code" >> "$GITHUB_ENV"
      - run: bun run e2e:smoke
        env:
          BASE_URL: http://localhost:3000
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: docker compose down -v
