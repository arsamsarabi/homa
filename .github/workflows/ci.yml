name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: homa
          POSTGRES_PASSWORD: homa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U homa" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://homa:homa@localhost:5432/postgres
      TEST_CALDAV_URL: http://127.0.0.1:5232/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # The CalDAV conformance tests run against a real Radicale. Any password is accepted
      # (--auth-type none); each test run uses its own user. Pinned by digest.
      - name: Radicale for the CalDAV tests
        run: |
          docker run -d --name radicale -p 127.0.0.1:5232:5232 --tmpfs /var/lib/radicale:mode=1777 \
            ghcr.io/kozea/radicale:3.8.3@sha256:62e281f4b35f1a5e52209cd99ad7081add25532f4c10df225b3a1519e64f70ca \
            --hosts 0.0.0.0:5232 --auth-type none
          for i in $(seq 30); do curl -sf -o /dev/null -X OPTIONS "$TEST_CALDAV_URL" && exit 0; sleep 1; done
          docker logs radicale; exit 1
      - run: bun run test
      - run: bun run build
      - name: Generated API client is up to date
        run: |
          bun run openapi
          git diff --exit-code -- packages/api-client || {
            echo "::error::packages/api-client is out of date. Run 'bun run openapi' and commit the result."
            exit 1
          }

  e2e:
    name: Docker image and smoke test
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: deploy/docker/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Throwaway auth secret for this run
        run: |
          secret=$(openssl rand -base64 32)
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
          # Notification channels with tokens or secrets need the encryption key.
          key=$(openssl rand -base64 32)
          echo "::add-mask::$key"
          echo "HOMA_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
          # The specs sign up several accounts from one address within seconds.
          echo "HOMA_AUTH_RATE_LIMIT=false" >> "$GITHUB_ENV"
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: First-run setup code from the API log
        run: |
          code=$(docker compose logs api | grep -oE 'first-run setup code: [0-9]{4}' | head -1 | grep -oE '[0-9]{4}$')
          test -n "$code"
          echo "HOMA_SETUP_CODE=$code" >> "$GITHUB_ENV"
      - run: bun run e2e:smoke
        env:
          BASE_URL: http://localhost:3000
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: docker compose down -v
