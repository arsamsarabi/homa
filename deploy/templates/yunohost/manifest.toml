#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
# A package skeleton for YunoHost (packaging format 2). Untested on a real YunoHost server; see
# docs/self-hosting/yunohost.md. A real package lives in its own homa_ynh repository.

packaging_format = 2

id = "homa"
name = "Homa"
description.en = "Self-hosted calendar and task app, in English and Farsi"
description.fr = "Agenda et gestionnaire de tâches auto-hébergé, en anglais et en persan"

version = "0.3.0~ynh1"

maintainers = []

[upstream]
license = "PolyForm-Noncommercial-1.0.0"
website = "https://homa.day"
demo = "https://demo.homa.day"
code = "https://github.com/arsamsarabi/homa"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "600M"
ram.build = "1G"
ram.runtime = "300M"

[install]
    [install.domain]
    # Homa runs at the root of a domain; it has no sub-path support.
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/arsamsarabi/homa/archive/refs/tags/v0.3.0.tar.gz"
        sha256 = "a56b0827f55143ff5b32ca0abf409bb2d844f8e38f765252822c87018318e0b4"

        # The Bun version in deploy/docker/Dockerfile.
        [resources.sources.bun]
        amd64.url = "https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-x64.zip"
        amd64.sha256 = "3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18"
        arm64.url = "https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-aarch64.zip"
        arm64.sha256 = "efa9813da5ed72423bf847f916e8d2c47c0d776add972354026a75e10da9aa21"
        in_subdir = true
        prefetch = false

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 3000

    [resources.apt]
    packages = "postgresql, unzip"

    [resources.database]
    type = "postgresql"
