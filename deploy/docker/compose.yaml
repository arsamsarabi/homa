# Self-host Homa: docker compose -f deploy/docker/compose.yaml up -d
# Needs BETTER_AUTH_SECRET in the environment or a .env file next to this one
# (openssl rand -base64 32). Then open HOMA_URL (default http://localhost:3000).
# Pulls the published image (set HOMA_VERSION in .env to pin a release). Compose builds it from
# this repository only when the pull fails, or when you pass --build.
name: homa

x-homa: &homa
  image: ghcr.io/arsamsarabi/homa:${HOMA_VERSION:-latest}
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &homa-env
    DATABASE_URL: postgres://homa:${POSTGRES_PASSWORD:-homa}@postgres:5432/homa
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
    HOMA_URL: ${HOMA_URL:-http://localhost:3000}
    # Needed once anyone adds a connected calendar (openssl rand -base64 32); keep it with your backups.
    HOMA_ENCRYPTION_KEY: ${HOMA_ENCRYPTION_KEY:-}
    HOMA_SYNC_INTERVAL_MINUTES: ${HOMA_SYNC_INTERVAL_MINUTES:-30}
    HOMA_SYNC_ALLOW_PRIVATE_NETWORKS: ${HOMA_SYNC_ALLOW_PRIVATE_NETWORKS:-false}
    # Web push for reminders: generated and stored on first start when unset.
    HOMA_VAPID_PUBLIC_KEY: ${HOMA_VAPID_PUBLIC_KEY:-}
    HOMA_VAPID_PRIVATE_KEY: ${HOMA_VAPID_PRIVATE_KEY:-}
    HOMA_VAPID_SUBJECT: ${HOMA_VAPID_SUBJECT:-}
    HOMA_NOTIFY_ALLOW_PRIVATE_NETWORKS: ${HOMA_NOTIFY_ALLOW_PRIVATE_NETWORKS:-false}
    # Email (reminders, address confirmation, password reset): both or neither (docs/self-hosting/notifications.md).
    HOMA_SMTP_URL: ${HOMA_SMTP_URL:-}
    HOMA_MAIL_FROM: ${HOMA_MAIL_FROM:-}
    # New accounts confirm their email address; defaults to true when email is set up.
    HOMA_REQUIRE_EMAIL_VERIFICATION: ${HOMA_REQUIRE_EMAIL_VERIFICATION:-}
    # Optional: your Google OAuth client, for Google Calendar connections (docs/self-hosting/google.md).
    HOMA_GOOGLE_CLIENT_ID: ${HOMA_GOOGLE_CLIENT_ID:-}
    HOMA_GOOGLE_CLIENT_SECRET: ${HOMA_GOOGLE_CLIENT_SECRET:-}
    # Optional: your Microsoft Entra ID app, for Outlook.com and Microsoft 365 (docs/self-hosting/microsoft.md).
    HOMA_MICROSOFT_CLIENT_ID: ${HOMA_MICROSOFT_CLIENT_ID:-}
    HOMA_MICROSOFT_CLIENT_SECRET: ${HOMA_MICROSOFT_CLIENT_SECRET:-}
    # Only for automated tests: false lifts the sign-in and sign-up rate limits.
    HOMA_AUTH_RATE_LIMIT: ${HOMA_AUTH_RATE_LIMIT:-true}

services:
  api:
    <<: *homa
    environment:
      <<: *homa-env
      HOMA_ROLE: api
    ports:
      - "${HOMA_PORT:-3000}:3000"

  worker:
    <<: *homa
    environment:
      <<: *homa-env
      HOMA_ROLE: worker
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homa}
      POSTGRES_DB: homa
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homa -d homa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
