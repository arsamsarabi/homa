[install]
# Only install package versions published at least a week ago (supply-chain safety).
minimumReleaseAge = 604800
exact = true

[test]
# Playwright specs run with `bun run e2e`. The web app's tests need a DOM, so they run from apps/web
# (`bun run test` at the root runs every package's tests the right way).
pathIgnorePatterns = ["e2e/**", "apps/web/**"]
